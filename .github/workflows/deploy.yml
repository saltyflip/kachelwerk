name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht gegenseitig ueberholen lassen
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        env:
          # Pages liefert unter https://<nutzer>.github.io/<repo>/ aus
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Fallback fuer Deep Links
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          # Aktiviert Pages beim ersten Lauf selbst, statt abzubrechen,
          # solange unter Settings -> Pages noch nichts eingestellt ist
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
