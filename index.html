<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="description" content="Kachelwerk - Gewohnheiten verfolgen, offline und ohne Account. Alle Daten bleiben auf deinem Geraet." />
    <title>Kachelwerk</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Theme vor dem ersten Rendern setzen, damit nichts aufblitzt.
      (function () {
        try {
          var wahl = localStorage.getItem('kachelwerk-theme') || 'dunkel';
          var dunkel =
            wahl === 'dunkel' ||
            (wahl === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dunkel);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dunkel ? '#0b0d10' : '#f5f6f9');
        } catch (e) {
          /* localStorage gesperrt: Dark bleibt als Standard aktiv */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
